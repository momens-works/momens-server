# 레거시 차등 비교 하네스의 고정값(MOM-0877). run.sh 가 source 해서 export 합니다.
#
# 여기 있는 값은 전부 로컬 하네스 전용 더미입니다. 실제 비밀이 아니며, 커밋 금지 대상인
# .env 계열과 이름으로 구분하려고 .conf 를 씁니다(docs/rules/configuration.md 시크릿 절).
#
# 외부 provider를 호출하지 않는 로컬 비교용 설정입니다. 신규 필수 설정은 여기에 더미값으로 추가합니다.

# 두 서버가 공유하는 HS256 서명 키(ADR-0017). 이 값이 같아야 한 토큰으로 양쪽을 호출합니다.
MOMENS_DIFF_JWT_SECRET=legacy-diff-harness-secret-0123456789abcdef

# 포트
MOMENS_DIFF_LEGACY_PORT=18080
MOMENS_DIFF_SERVER_PORT=18081
MOMENS_DIFF_LEGACY_DB_PORT=15433
MOMENS_DIFF_SERVER_DB_PORT=15434

# 신규 서버 기동용
DATABASE_URL=jdbc:postgresql://localhost:${MOMENS_DIFF_SERVER_DB_PORT}/momens_server
DATABASE_USERNAME=momens
DATABASE_PASSWORD=momens
SERVER_PORT=${MOMENS_DIFF_SERVER_PORT}
MOMENS_AUTH_GOOGLE_AUDIENCES=legacy-diff.apps.googleusercontent.com
MOMENS_AUTH_GOOGLE_CLIENT_ID=legacy-diff.apps.googleusercontent.com
MOMENS_AUTH_GOOGLE_CLIENT_SECRET=legacy-diff-client-secret
MOMENS_AUTH_GOOGLE_REDIRECT_URI=http://localhost:${MOMENS_DIFF_SERVER_PORT}/api/auth/google/callback
MOMENS_AUTH_WEB_SUCCESS_REDIRECT_URI=http://localhost:3000/
MOMENS_AUTH_WEB_FAILURE_REDIRECT_URI=http://localhost:3000/login
MOMENS_AUTH_DEV_TOKEN_SECRET=legacy-diff-dev-token-secret-0123456789
