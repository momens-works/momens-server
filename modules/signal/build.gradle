import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
}

dependencies {
    // Boot BOM으로 버전을 관리합니다(boot 플러그인은 app만 적용).
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)

    // 공유 영속성 베이스와 공유 테스트 베이스. signals 읽기 엔티티는 worker가 쓰는 외부 테이블이라
    // BaseEntity(쓰기용 식별자·감사)를 상속하지 않지만, 공유 확장 마이그레이션과 테스트 베이스를 재사용합니다.
    implementation project(':common')
    // 목록 API의 멤버십 가드에 필요한 도메인 모듈 public API(module-map 의존 방향).
    implementation project(':project')
    implementation project(':workspace')
    // 상세 API의 evidence hydrate에 필요한 source_ref 조회 public API(module-map 의존 방향).
    implementation project(':source')
    // Signal action 결과(signal.converted_to_task/signal.dismissed) outbox 발행(CO-6, ADR-0008).
    implementation project(':outbox')
    // convert-to-task의 task draft 생성 public API(ADR-0014, module-map 의존 방향).
    implementation project(':minsu')
    // worker가 발행하는 Signal·Outbox 이벤트의 공용 protobuf 계약.
    implementation libs.momens.proto

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // 도메인 enum의 value()에 @JsonValue를 적용해 OpenAPI 문서의 값 목록에 실제 저장 값을 사용합니다.
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    // dev 데모용 Signal 생성 컨트롤러(@DevOnly, docs/design/signal-push-demo-design.md 11.2절).
    // 앱이 호출하는 /api/mobile/* 표면과 달리 dev 도구 표면이라 이 모듈이 소유합니다.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // OpenAPI 문서화 애너테이션만 사용합니다. Swagger UI와 공통 설정은 app이 소유합니다(docs/spec/openapi.md).
    implementation libs.swagger.annotations.jakarta

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // common testFixtures의 Testcontainers 통합테스트 베이스를 재사용합니다.
    testImplementation testFixtures(project(':common'))
    // 슬라이스 통합 테스트에서 project/workspace Flyway 체인(users FK)을 만족시키기 위해 필요.
    testImplementation project(':user')
    // dev 생성 컨트롤러 web 슬라이스 테스트(@WebMvcTest).
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}
