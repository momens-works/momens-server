import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
}

dependencies {
    // Boot BOM으로 버전을 관리합니다(boot 플러그인은 app만 적용).
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)

    // 공유 영속성 베이스와 공유 에러 계약. source_refs 읽기 엔티티는 외부 소유 테이블이라
    // BaseEntity(쓰기용 식별자·감사)를 상속하지 않지만, 공유 확장 마이그레이션과 테스트 베이스를 재사용합니다.
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation libs.swagger.annotations.jakarta

    implementation 'org.springframework.security:spring-security-oauth2-jose'

    implementation 'com.fasterxml.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // common testFixtures의 Testcontainers 통합테스트 베이스를 재사용합니다.
    testImplementation testFixtures(project(':common'))

    testImplementation project(':workspace')
    testImplementation project(':user')
    // WorkspaceSeedSql을 사용해 source_refs의 workspaces 및 users 외래 키 제약을 만족하는 행을 저장합니다.
    testImplementation testFixtures(project(':workspace'))
}
