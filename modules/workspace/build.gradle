import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

dependencies {
    // Boot BOM으로 버전을 관리합니다(boot 플러그인은 app만 적용).
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)

    // 공유 영속성 베이스(BaseEntity, JPA Auditing)와 공유 에러 계약.
    implementation project(':common')
    // 초대 흐름이 초대한 사람과 초대 대상 사용자를 조회합니다(MOM-0865).
    implementation project(':user')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework:spring-web'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // common testFixtures의 Testcontainers 통합테스트 베이스를 재사용합니다.
    testImplementation testFixtures(project(':common'))

    // workspaces와 users를 참조하는 다른 모듈의 통합 테스트에서 외래 키 제약을 만족하는 행을 저장할 수 있도록
    // testFixtures를 제공합니다. WorkspaceSeedSql이 TestEntityManager를 매개변수로 받으므로 소비 모듈에서도
    // 해당 타입을 사용할 수 있도록 api로 선언합니다.
    testFixturesApi platform(SpringBootPlugin.BOM_COORDINATES)
    testFixturesApi 'org.springframework.boot:spring-boot-starter-data-jpa-test'
}
