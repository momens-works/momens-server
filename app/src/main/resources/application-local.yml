# 로컬 개발 프로필.
# 실제 값은 커밋하지 않는 .env 에서 주입합니다(.env.example 참고).
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/momens}
    username: ${DATABASE_USERNAME:momens}
    password: ${DATABASE_PASSWORD:momens}
  jpa:
    show-sql: true

momens:
  cors:
    # 로컬 웹 프론트(momens-fe) origin. 레거시처럼 localhost 와 127.0.0.1 둘 다 허용합니다.
    # 새 FE 는 3000 포트라(auth redirect 기준) 레거시 5173 대신 3000 을 씁니다.
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  auth:
    # dev 전용 토큰 발급 엔드포인트(MOM-90). secret 은 .env 로 주입합니다(.env.example 참고).
    dev-token:
      secret: ${MOMENS_AUTH_DEV_TOKEN_SECRET}
      allowed-emails:
        - owner@momens.works
        - member@momens.works
    web:
      cookie:
        # 로컬은 http라 Secure 쿠키가 설정되지 않으므로 끕니다(운영 기본값은 true).
        secure: false

# 지표를 눈으로 확인할 수 있는 유일한 표면입니다. 수집 백엔드를 아직 정하지 않아 export 경로가 없고
# (docs/rules/observability.md 적용 범위), dev 환경도 현재 없습니다. 로컬에서 잠정값을 측정하고 dev가
# 생기면 재검증하는 방식은 동기 경로의 timeout을 정할 때 이미 쓴 방식입니다(MOM-0806).
# local 프로필에만 둡니다. dev ingress는 `/` 전 경로를 공개 호스트로 라우팅하므로 그쪽에서 같은 설정을
# 켜면 인증 없이 외부에 노출됩니다. dev·prod 노출 범위는 환경을 다시 세울 때 함께 정합니다.
# SecurityConfig의 PUBLIC_PATHS에는 `/actuator/health/**`만 있어 `/actuator/metrics`는 보호 체인에
# 걸립니다. 조회하려면 dev 토큰 엔드포인트(`POST /api/dev/auth/token`)로 받은 access token이 필요합니다.
# 이 동작은 MetricsEndpointIntegrationTest가 고정합니다.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    works.momens.server: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true
