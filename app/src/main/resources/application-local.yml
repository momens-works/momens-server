# 로컬 개발 프로필.
# 실제 값은 커밋하지 않는 .env 에서 주입합니다(.env.example 참고).
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/momens}
    username: ${DATABASE_USERNAME:momens}
    password: ${DATABASE_PASSWORD:momens}
  jpa:
    show-sql: true

momens:
  mcp:
    web-base-uri: ${MOMENS_MCP_WEB_BASE_URI:http://localhost:5173}
  cors:
    # 로컬 웹 프론트의 localhost와 127.0.0.1 origin을 모두 허용합니다.
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  auth:
    # dev 전용 토큰 발급 엔드포인트(MOM-90). secret 은 .env 로 주입합니다(.env.example 참고).
    dev-token:
      secret: ${MOMENS_AUTH_DEV_TOKEN_SECRET}
      allowed-emails:
        - owner@momens.works
        - member@momens.works
    web:
      cookie:
        # 로컬은 http라 Secure 쿠키가 설정되지 않으므로 끕니다(운영 기본값은 true).
        secure: false

# 로컬 진단용 metrics 노출입니다. dev·prod의 수집 백엔드 및 노출 정책은 별도입니다.
# /actuator/metrics는 인증이 필요하며 MetricsEndpointIntegrationTest가 이를 검증합니다.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  level:
    works.momens.server: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true
