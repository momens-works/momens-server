# 운영 프로필.
# 모든 민감 값은 환경변수로 주입합니다(Kubernetes Secret / External Secrets 등).
# 이 파일에는 실제 secret 을 두지 않습니다.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false
  # prod 스키마는 이 서버가 소유합니다(ADR-0019). Flyway 적용 뒤 공통 ddl-auto=validate로 매핑을 검증합니다.
  flyway:
    enabled: true

# CORS 허용 origin. 레거시 momens-api 와 동일하게 운영 기본값은 웹 도메인이고,
# CORS_ALLOWED_ORIGINS env 로 오버라이드합니다.
momens:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.momens.works}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    works.momens.server: INFO
  # 운영은 구조화 JSON 로그(Spring Boot 4.1 내장). 커스텀 appender를 두지 않습니다.
  # local/test는 사람이 읽는 console 포맷을 유지합니다.
  structured:
    format:
      console: logstash
