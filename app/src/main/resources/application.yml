# 공통 설정만 둡니다.
# 환경별 값과 민감 정보는 .env / 프로필별 설정 / 환경변수 placeholder로 다룹니다.
spring:
  application:
    name: momens-server
  # API wire format(snake_case)의 단일 소유자. DTO별 @JsonNaming 대신 auto-config JsonMapper에
  # 전역 적용해 애노테이션 누락으로 인한 문서-응답 드리프트를 차단합니다. RestClient 등 외부 API
  # 클라이언트 DTO도 이 전략을 타므로, camelCase wire를 쓰는 외부 API는 @JsonProperty로 명시합니다.
  # 문서(swagger-core)는 Jackson 2라 이 설정을 읽지 못해 OpenApiConfig의 ModelResolver가 같은
  # 전략을 별도로 겁니다. 기능 모듈 slice test는 app 설정을 읽지 않으므로 각 모듈
  # src/test/resources/application.yml에도 동일 키를 둡니다.
  jackson:
    property-naming-strategy: SNAKE_CASE
  # 기본 TaskScheduler는 풀 크기가 1이라 모든 @Scheduled가 한 스레드에서 직렬 실행됩니다(MOM-0810
  # 설계 11.3절). minsu drain은 claim 트랜잭션만 이 스레드에서 하고 LLM 호출은 자기 실행기로
  # 넘기지만, 그래도 notification의 1초 주기 push 폴링과 같은 스레드를 쓰면 서로를 밀어냅니다.
  # @Scheduled 빈이 넷입니다: notification push 폴링, minsu drain, minsu 지표 스냅샷,
  # minsu 원장 종료. 앞의 둘은 오래 블로킹합니다(drain은 배치의 wall-clock 상한까지, push는 FCM
  # 발송까지). 풀이 그보다 작으면 뒤의 둘이 그만큼 밀리는데, 하필 drain이 느린 상황이 그 둘이
  # 존재하는 이유라 관측이 필요한 순간에 관측이 멈춥니다. 빈 수보다 하나 크게 둔 것은 그 실패가
  # 조용하기 때문입니다. 다른 모듈이 폴러를 하나 더 붙일 때 이 파일을 볼 사람이 minsu 담당자가
  # 아닙니다(SchedulingConfig 참고).
  task:
    scheduling:
      pool:
        size: 5
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

momens:
  openapi:
    server-url: ${MOMENS_OPENAPI_SERVER_URL:http://localhost:8080}
  # 웹 브라우저 cross-origin 허용(MOM-55). 허용 origin은 환경별로 주입합니다.
  # 모바일은 Authorization 헤더로 호출하는 네이티브 클라이언트라 CORS 대상이 아닙니다.
  cors:
    # env 이름은 레거시 momens-api 와 동일하게 CORS_ALLOWED_ORIGINS 를 씁니다(배포 설정 재사용).
    # 내부 설정 키는 momens.cors.* 네임스페이스를 따르되, 외부 주입 env 만 레거시에 맞췄습니다.
    # comma-separated 로 주입하고, 미설정 시 빈 목록(아무 origin 도 허용 안 함)입니다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # signal.created 소비·FCM 발송(MOM-0690). 켜면 Firebase Admin SDK가 ADC로 초기화되므로
  # Workload Identity 또는 GOOGLE_APPLICATION_CREDENTIALS가 준비된 환경에서만 켭니다.
  # local/test 기본은 off이고, 설치 등록·해제 API는 이 값과 무관하게 항상 동작합니다.
  notification:
    push:
      enabled: ${MOMENS_NOTIFICATION_PUSH_ENABLED:false}
      firebase:
        # ADC 서비스 계정의 소속 프로젝트와 FCM 대상 프로젝트가 다를 수 있어 명시적으로 주입합니다.
        project-id: ${MOMENS_NOTIFICATION_PUSH_FIREBASE_PROJECT_ID:}
  # Signal task draft 생성 기반(MOM-0805)과 convert-to-task 연동(MOM-0804). 기본 비활성이며 이때는
  # 고정 fallback draft를 사용합니다. MOM-0806에서 로컬 측정 후 8초 timeout을 적용했지만,
  # dev/ingress 재검증 전에는 prod에서 활성화하지 않습니다.
  minsu:
    task-draft:
      # provider 축: 모델 호출 자체가 활성인가(MOM-0810 설계 11.2절).
      enabled: ${MOMENS_MINSU_TASK_DRAFT_ENABLED:false}
      # 원장 지표 스냅샷 주기(MOM-0821). gauge 콜백에서 DB를 조회하지 않고 이 주기로 집계 한 번을 돌려
      # 스냅샷을 갈아끼웁니다(docs/rules/observability.md). 이 지표가 잡는 것은 scheduler 정지와 lease
      # 적체라 검출이 수십 초 늦어도 무방하고, lease 기본값 60s에 비해 10s면 충분히 촘촘합니다.
      # 비동기 축과 무관하게 동작합니다. drain을 끈 뒤 남은 pending을 보는 것이 핵심 용도입니다.
      metrics:
        snapshot-interval: ${MOMENS_MINSU_TASK_DRAFT_METRICS_SNAPSHOT_INTERVAL:10s}
      # 비동기 생성의 나머지 두 축(MOM-0817). enroll은 신규 convert의 원장 적재, drain은 scheduler의
      # 원장 처리를 제어합니다. 축을 나눈 이유는 rollback 시 신규만 동기로 되돌리고 기존 원장은 계속
      # 처리해야 하기 때문입니다. provider가 꺼져 있으면 enroll 값과 무관하게 적재하지 않습니다.
      async:
        enroll: ${MOMENS_MINSU_TASK_DRAFT_ASYNC_ENROLL:false}
        drain: ${MOMENS_MINSU_TASK_DRAFT_ASYNC_DRAIN:false}
        # 실행·재시도 정책(MOM-0819). 전부 잠정값이고 MOM-0824의 dev 재측정으로 조정합니다.
        # 부등식 attempt-timeout < lease < (generation-deadline - apply-margin)은 부팅에서 강제합니다.
        # provider-timeout은 동기 경로의 momens.minsu.llm.timeout(8s)과 별도 키입니다. 비동기는
        # 아무도 기다리지 않으므로 더 크게 잡되, SDK가 wall-clock 상한보다 먼저 끊어야 슬롯이 정상
        # 반환되므로 attempt-timeout 이하로 둡니다.
        execution:
          provider-timeout: ${MOMENS_MINSU_TASK_DRAFT_ASYNC_PROVIDER_TIMEOUT:20s}
          attempt-timeout: ${MOMENS_MINSU_TASK_DRAFT_ASYNC_ATTEMPT_TIMEOUT:30s}
          lease: ${MOMENS_MINSU_TASK_DRAFT_ASYNC_LEASE:60s}
          max-attempts: ${MOMENS_MINSU_TASK_DRAFT_ASYNC_MAX_ATTEMPTS:4}
          backoffs: ${MOMENS_MINSU_TASK_DRAFT_ASYNC_BACKOFFS:10s,30s,2m}
          concurrency: ${MOMENS_MINSU_TASK_DRAFT_ASYNC_CONCURRENCY:4}
    llm:
      provider: ${MOMENS_MINSU_LLM_PROVIDER:google}
      model: ${MOMENS_MINSU_LLM_MODEL:gemini-3.5-flash-lite}
      timeout: ${MOMENS_MINSU_LLM_TIMEOUT:8s}
      google:
        project: ${MOMENS_MINSU_LLM_GOOGLE_PROJECT:}
        location: ${MOMENS_MINSU_LLM_GOOGLE_LOCATION:global}
  auth:
    # HS256 대칭키(>=32바이트). 실제 값은 .env / 환경변수로 주입하고 커밋하지 않습니다.
    jwt-secret: ${MOMENS_AUTH_JWT_SECRET}
    # access token은 자체 검증(HS256)이라 매 요청 서버 상태를 조회하지 않으므로, TTL이 곧 변경된 권한의
    # stale 상한이 됩니다. 데모·운영 편의를 위해 24h로 둡니다(그만큼 폐기/로그아웃 세션이 오래 유효).
    access-ttl: 24h
    # refresh token은 서버 저장형으로 관리합니다(ADR-0005).
    refresh-ttl: 14d
    google:
      # Google ID token aud 허용 목록. web/android/ios client-id를 comma-separated env로 주입합니다.
      audiences: ${MOMENS_AUTH_GOOGLE_AUDIENCES}
    # 웹 Authorization Code 플로우(서버 주도 code 교환 + HttpOnly 쿠키 전송, MOM-22).
    web:
      google-oauth:
        # client-secret은 secret이므로 .env / 환경변수로 주입하고 커밋하지 않습니다.
        client-id: ${MOMENS_AUTH_GOOGLE_CLIENT_ID}
        client-secret: ${MOMENS_AUTH_GOOGLE_CLIENT_SECRET}
        redirect-uri: ${MOMENS_AUTH_GOOGLE_REDIRECT_URI}
      # 로그인 성공/실패 후 브라우저를 보낼 momens-fe URL.
      redirect:
        success-uri: ${MOMENS_AUTH_WEB_SUCCESS_REDIRECT_URI}
        failure-uri: ${MOMENS_AUTH_WEB_FAILURE_REDIRECT_URI}
  workspace:
    invitation:
      email:
        provider: ${EMAIL_PROVIDER:noop}
        accept-url: ${APP_INVITE_URL:}
        from: ${EMAIL_FROM:}
        reply-to: ${EMAIL_REPLY_TO:}
        resend:
          api-key: ${RESEND_API_KEY:}
  source:
    oauth:
      redirect-uri: ${MOMENS_SOURCE_OAUTH_REDIRECT_URI:}
      success-redirect-uri: ${MOMENS_SOURCE_OAUTH_SUCCESS_REDIRECT_URI:}
      state-secret: ${MOMENS_SOURCE_OAUTH_STATE_SECRET:}
      token-key: ${MOMENS_SOURCE_OAUTH_TOKEN_KEY:}
      state-ttl: ${MOMENS_SOURCE_OAUTH_STATE_TTL:10m}
      providers:
        github:
          client-id: ${MOMENS_SOURCE_OAUTH_GITHUB_CLIENT_ID:}
          client-secret: ${MOMENS_SOURCE_OAUTH_GITHUB_CLIENT_SECRET:}
        slack:
          client-id: ${MOMENS_SOURCE_OAUTH_SLACK_CLIENT_ID:}
          client-secret: ${MOMENS_SOURCE_OAUTH_SLACK_CLIENT_SECRET:}
        notion:
          client-id: ${MOMENS_SOURCE_OAUTH_NOTION_CLIENT_ID:}
          client-secret: ${MOMENS_SOURCE_OAUTH_NOTION_CLIENT_SECRET:}
        figma:
          client-id: ${MOMENS_SOURCE_OAUTH_FIGMA_CLIENT_ID:}
          client-secret: ${MOMENS_SOURCE_OAUTH_FIGMA_CLIENT_SECRET:}

# 헬스체크는 Actuator 기본 /actuator/health 만 노출합니다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # 로그 상관관계용 trace context(traceId/spanId)는 유지하되, 분산추적/메트릭/로그 OTLP
  # export는 비활성화합니다. collector endpoint와 sampling은 수집 백엔드를 정하고 배선할 때
  # (MOM-0834) 켭니다 — 그전엔 기본 endpoint(localhost:4318)로 전송을 시도해 연결 오류가 납니다.
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 공통 baseline 로그 레벨. 프로필이 누락해도 안전한 기본값을 보장합니다.
# 프로필별 상세 레벨/포맷은 application-<profile>.yml 에서 override 합니다.
# 요청 상관관계(traceId/spanId)는 Micrometer Tracing 브리지가 자동으로 로그에 채웁니다.
logging:
  level:
    root: INFO
