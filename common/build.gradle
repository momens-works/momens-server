import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

dependencies {
    // Boot BOM으로 버전을 관리합니다(boot 플러그인은 app만 적용).
    api platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testFixturesApi platform(SpringBootPlugin.BOM_COORDINATES)

    // 영속성 베이스(@MappedSuperclass, JPA Auditing, Persistable)는 기능 모듈에 노출합니다.
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 모듈 경계 선언 애너테이션(@ApplicationModule, @NamedInterface)만 사용합니다. 애너테이션 클래스가
    // 런타임 클래스패스에 없어도 JVM은 해당 애너테이션을 무시하므로 컴파일 클래스패스에만 둡니다. 경계 검증은
    // app 테스트의 starter-test가 담당합니다(MOM-0921).
    compileOnlyApi libs.spring.modulith.api

    // 공유 에러 응답(ErrorResponse)의 @JsonInclude. spring-web 없이 애너테이션만 사용합니다.
    implementation 'com.fasterxml.jackson.core:jackson-annotations'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // common 자체 순수 로직(CurrentUser 등) 단위 테스트.
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // 통합테스트 베이스(testFixtures)를 의존 모듈이 재사용합니다.
    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4는 테스트 슬라이스를 기술별 스타터로 분리합니다(@DataJpaTest 등).
    testFixturesApi 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testFixturesApi 'org.testcontainers:testcontainers-junit-jupiter'
    testFixturesApi 'org.testcontainers:testcontainers-postgresql'
    // 통합테스트는 실제 PostgreSQL을 쓰므로 JDBC 드라이버가 테스트 런타임에 필요합니다.
    testFixturesApi 'org.postgresql:postgresql'
    // 통합테스트 베이스를 쓰는 모듈이 JUnit Platform launcher를 함께 상속합니다.
    testFixturesApi 'org.junit.platform:junit-platform-launcher'

    // 모듈별 repository 통합테스트가 자기 마이그레이션을 Flyway로 적용하도록 합니다.
    // Boot 4는 Flyway 자동구성을 별도 모듈로 분리하므로 starter로 가져옵니다.
    testFixturesApi 'org.springframework.boot:spring-boot-starter-flyway'
    testFixturesApi 'org.flywaydb:flyway-database-postgresql'
}
