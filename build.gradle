plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spotless) apply false
}

allprojects {
    group = 'works.momens'
    version = '0.1.0-SNAPSHOT'
}

// 루트의 build.gradle과 settings.gradle도 마지막 줄 개행과 공백 정리를 강제합니다.
// java 블록은 .java만 다뤄서 gradle 파일이 검사에서 빠졌고, 리뷰에서 두 번 지적됐습니다(PR #41, #42).
apply plugin: 'com.diffplug.spotless'

spotless {
    format 'gradle', {
        target '*.gradle'
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'versionCatalog', {
        target 'gradle/*.versions.toml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// 로컬 git 훅을 설치합니다. hooks/ 는 버전 관리되지만 .git/hooks 는 아니므로,
// core.hooksPath 를 hooks/ 로 지정해 저장소 훅을 그대로 쓰게 합니다(최초 1회 실행).
tasks.register('installGitHooks', Exec) {
    group = 'git hooks'
    description = 'core.hooksPath 를 hooks/ 로 설정해 저장소 공용 git 훅을 활성화합니다.'
    commandLine 'git', 'config', 'core.hooksPath', 'hooks'
}

// settings.gradle에 등록한 모든 서브프로젝트는 Docker 의존성 워밍 레이어에서도
// build.gradle을 먼저 복사해야 합니다. 이 목록이 어긋나면 COPY . . 전 Gradle 구성에 실패합니다.
tasks.register('verifyDockerModuleBuildScripts') {
    group = 'verification'
    description = 'Gradle 서브프로젝트의 build.gradle이 Docker 워밍 레이어에 포함됐는지 검사합니다.'

    doLast {
        Set<String> gradleModules = subprojects.collect { subproject ->
            rootProject.projectDir.toPath()
                .relativize(subproject.projectDir.toPath())
                .toString()
                .replace(File.separator, '/')
        }.toSet()
        Set<String> dockerModules = new TreeSet<>()
        List<String> invalidCopies = []

        file('Dockerfile').eachLine { line ->
            def matcher = line =~ /^\s*COPY\s+(\S+)\/build\.gradle\s+(\S+)\s*$/
            if (matcher.matches()) {
                String sourceDir = matcher.group(1).replaceFirst('^\\./', '')
                String destinationDir = matcher.group(2)
                    .replaceFirst('^\\./', '')
                    .replaceFirst('/$', '')
                if (sourceDir == destinationDir) {
                    dockerModules.add(sourceDir)
                } else {
                    invalidCopies.add(line.trim())
                }
            }
        }

        Set<String> missingModules = new TreeSet<>(gradleModules)
        missingModules.removeAll(dockerModules)
        Set<String> staleModules = new TreeSet<>(dockerModules)
        staleModules.removeAll(gradleModules)
        List<String> errors = []
        if (!missingModules.isEmpty()) {
            errors.add("누락된 모듈: ${missingModules.join(', ')}")
        }
        if (!staleModules.isEmpty()) {
            errors.add("제거되지 않은 모듈: ${staleModules.join(', ')}")
        }
        if (!invalidCopies.isEmpty()) {
            errors.add("source와 destination이 다른 COPY: ${invalidCopies.join(', ')}")
        }

        if (!errors.isEmpty()) {
            throw new GradleException(
                "Gradle 서브프로젝트와 Dockerfile 의존성 워밍 레이어가 일치하지 않습니다.\n- "
                    + errors.join('\n- '))
        }
    }
}

// 버전을 명시하는 의존성은 버전 카탈로그(gradle/libs.versions.toml)에서 관리합니다
// (docs/rules/architecture.md). Dependabot은 settings.gradle을 정규식으로 분석하므로 modules/
// 아래 프로젝트를 인식하지 못합니다. 따라서 해당 프로젝트의 build.gradle에 버전을 직접 선언해도
// 빌드는 통과하지만 Dependabot의 의존성 업데이트 대상에서는 제외됩니다. 이 태스크는 Dependabot이
// build.gradle에서 버전을 찾을 때 사용하는 정규식과 동일한 기준으로 검사합니다
// (dependabot-core gradle/lib/dependabot/gradle/file_parser.rb).
tasks.register('verifyDependencyVersionsInCatalog') {
    group = 'verification'
    description = '빌드 스크립트에 버전 카탈로그 외부의 버전 선언이 있는지 검사합니다.'

    // configuration cache 요구사항에 따라 실행 시점에 Project를 참조하지 않도록 파일 목록을 구성 단계에서
    // 확정합니다. includeBuild로 포함된 third_party/momens-proto는 allprojects에 포함되지 않습니다.
    List<File> buildScripts = allprojects.collect { it.buildFile }
    java.nio.file.Path rootPath = rootProject.projectDir.toPath()

    doLast {
        String part = /[^\s,@'":\/\\]+/
        String versionPart = /[^\s,'":\/\\]+/
        // 한 규칙에 정의된 모든 패턴이 같은 줄에서 일치하면 위반으로 판정합니다. 규칙을 추가할 때는 목록에
        // 항목 하나를 추가합니다.
        List<Map> rules = [
            [name: '좌표 문자열', patterns: [~/(?:\(|[\s,])\s*['"]${part}:${part}:${versionPart}['"]/]],
            [name: '키워드 인자', patterns: ['group', 'name', 'version'].collect { key ->
                ~/(?:^|[\s,(\[])${key}\s*[:=]\s*['"]/
            }],
            [name: '플러그인 버전', patterns: [
                ~/(?:^|\s)(?:id|kotlin)(?:\s+['"]${part}['"]|\(['"]${part}['"]\)).*\bversion\s+['"]?${versionPart}/
            ]],
        ]

        List<String> violations = []
        buildScripts.each { File script ->
            String location = rootPath.relativize(script.toPath()).toString().replace(File.separator, '/')
            script.readLines('UTF-8').eachWithIndex { String line, int index ->
                if (line.trim().startsWith('//')) {
                    return
                }
                rules.each { Map rule ->
                    if (rule.patterns.every { line =~ it }) {
                        violations.add("${location}:${index + 1}: ${rule.name}: ${line.trim()}")
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                "버전 카탈로그 외부에 버전을 선언한 빌드 스크립트가 있습니다.\n- "
                    + violations.join('\n- ')
                    + "\ngradle/libs.versions.toml에 버전 항목을 추가한 뒤 libs.<alias>로 참조하세요.")
        }
    }
}

// FQN 표기 규칙은 모든 모듈의 main/test 소스에 적용합니다. Java 구문 트리를 읽어 주석과
// JPQL·reflection 대상 문자열을 제외합니다. package-info.java의 패키지 애너테이션은
// import보다 앞에 있어야 하므로 FQN을 사용할 수밖에 없어 검사에서 제외합니다.
tasks.register('verifyNoUnnecessaryFqn') {
    group = 'verification'
    description = 'Java 소스에서 import 가능한 타입의 FQN 직접 참조를 검사합니다.'

    def javaSources = files(subprojects.collect { subproject ->
        subproject.fileTree('src') {
            include '**/*.java'
            exclude '**/package-info.java'
        }
    })
    inputs.files(javaSources).withPathSensitivity(PathSensitivity.RELATIVE)

    doLast {
        def compiler = javax.tools.ToolProvider.systemJavaCompiler
        def fileManager = compiler.getStandardFileManager(null, null, java.nio.charset.StandardCharsets.UTF_8)
        def violations = [] as Set
        try {
            javaSources.files.sort().each { File source ->
                def task = (com.sun.source.util.JavacTask) compiler.getTask(
                    null, fileManager, null, ['-proc:none'], null, fileManager.getJavaFileObjects(source))
                task.parse().each { unit ->
                    def positions = com.sun.source.util.Trees.instance(task).sourcePositions
                    new com.sun.source.util.TreeScanner<Void, Void>() {
                        @Override
                        Void visitImport(com.sun.source.tree.ImportTree node, Void ignored) {
                            null
                        }

                        @Override
                        Void visitMemberSelect(com.sun.source.tree.MemberSelectTree node, Void ignored) {
                            if (node.expression.toString() ==~ /^[a-z][A-Za-z0-9_]*(\.[a-z][A-Za-z0-9_]*)+$/
                                    && node.identifier.toString() ==~ /^[A-Z][A-Za-z0-9_]*$/) {
                                def line = unit.lineMap.getLineNumber(positions.getStartPosition(unit, node))
                                def location = rootProject.projectDir.toPath()
                                    .relativize(source.toPath()).toString().replace(File.separator, '/')
                                violations.add("${location}:${line}: ${node}")
                            }
                            super.visitMemberSelect(node, ignored)
                        }
                    }.scan(unit, null)
                }
            }
        } finally {
            fileManager.close()
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                "import 가능한 타입을 FQN으로 참조했습니다.\n- " + violations.sort().join('\n- '))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyDockerModuleBuildScripts')
    dependsOn tasks.named('verifyDependencyVersionsInCatalog')
    dependsOn tasks.named('verifyNoUnnecessaryFqn')
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    // Spring MVC가 @PathVariable 같은 핸들러 인자 이름을 리플렉션으로 읽을 수 있게 합니다.
    // Boot 플러그인이 붙는 app은 자동 적용되지만 feature 모듈은 java 플러그인만 써서 명시가 필요합니다.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    spotless {
        java {
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
        // 모듈 build.gradle의 마지막 줄 개행과 공백 정리도 강제합니다(위 루트 설정과 같은 이유).
        format 'gradle', {
            target '*.gradle'
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}
