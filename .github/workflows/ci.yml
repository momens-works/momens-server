name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# 기본 권한은 읽기만 허용하고, 이미지를 push하는 `build-image-dev` job에서만 필요한 권한을 추가로 부여합니다.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # 같은 ref에서 실행 중인 이전 검증만 취소합니다. workflow 레벨에 설정하면 전체 실행이 취소되어,
    # 테스트를 통과하고 진행 중이던 build-image-dev까지 함께 취소됩니다. 이 경우 새 커밋의 테스트가
    # 실패하면 직전 커밋의 이미지도 push되지 않으므로, 검증 취소는 이 job에만 적용합니다.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request merge ref의 base 부모와 병합 결과만 비교합니다.
          fetch-depth: 2

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # check에 연결된 검증 태스크(포맷, Gradle-Docker 모듈 정합성, 버전 카탈로그, 테스트)를 한 번에
      # 실행합니다. 새 검증 태스크는 check에 dependsOn으로 연결하면 이 단계에 포함됩니다. bootJar를 같은
      # 호출에 포함하면 Gradle이 태스크 그래프에 따라 테스트보다 bootJar를 먼저 실행할 수 있습니다. 그러면
      # 테스트가 실패하는 커밋에서도 JAR 조립 비용이 먼저 발생하므로, 두 호출을 분리합니다.
      - name: Check and test
        run: ./gradlew check

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          # 경로를 여러 개 넘기면 아티팩트 루트가 검색 경로들의 최소 공통 조상(저장소 루트)이
          # 되어, 실제로 리포트를 남긴 모듈이 몇 개든 모듈 경로가 아티팩트에 보존됩니다.
          path: |
            app/build/reports/tests/test/
            common/build/reports/tests/test/
            modules/*/build/reports/tests/test/
          # spotlessCheck 등 테스트 이전 단계에서 실패하면 리포트가 없으므로 경고도 남기지 않습니다.
          if-no-files-found: ignore
          retention-days: 7

      - name: Build boot jar
        run: ./gradlew bootJar

      # 실제 Docker 이미지 빌드에 영향을 주는 파일이 변경된 PR에서만 이미지 빌드를 검증합니다.
      # 이미지는 push하지 않으며, develop push의 build-image-dev와 이미지 push 정책은 그대로 유지합니다.
      - name: Detect Docker build input changes
        id: docker-inputs
        if: github.event_name == 'pull_request'
        run: |
          changed_files="$(git diff --name-only HEAD^1 HEAD)"
          if grep -Eq \
            '^(Dockerfile|\.dockerignore|\.gitattributes|gradlew|settings\.gradle|build\.gradle|gradle\.properties|\.github/workflows/ci\.yml)$|^gradle/|(^|/)build\.gradle$' \
            <<< "$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.docker-inputs.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Validate Docker image
        if: steps.docker-inputs.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          # PR에서는 base branch의 build-image-dev 캐시를 읽기만 합니다. PR ref별 캐시가 저장소 용량을
          # 차지하거나 develop 캐시를 밀어내지 않도록 별도 캐시는 저장하지 않습니다.
          cache-from: type=gha

  # develop 이미지 빌드는 같은 workflow의 build job에 의존하며, 테스트를 통과한 커밋의 이미지만 push합니다.
  # needs로 실행 순서를 지정하므로 workflow 이름을 문자열로 참조하는 workflow_run이 필요하지 않습니다.
  # checkout도 기본적으로 테스트한 커밋(github.sha)을 사용하므로 빌드할 커밋을 별도로 지정하지 않습니다.
  build-image-dev:
    needs: build
    # develop push와 수동 실행에서만 이미지를 push합니다. PR, main push, 다른 브랜치에서의
    # 수동 CI 실행은 이미지 push로 이어지지 않습니다.
    if: >-
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    # 같은 ref에서 실행 중인 이전 빌드는 취소해 불필요한 중복 빌드를 방지합니다.
    concurrency:
      group: build-momens-server-dev
      cancel-in-progress: true

    env:
      IMAGE: ghcr.io/momens-works/momens-server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # dev 배포 정책(D18)상 commit SHA 태그만 push 합니다. prod 워크플로와
      # 달리 latest 등 mutable 태그는 만들지 않습니다.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
